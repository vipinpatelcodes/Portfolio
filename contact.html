<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="contact" class="contact">
        <div class="contact__wrap">

            <div class="contact__intro">
                <h2 class="contact__title">Let's work together</h2>
                <p class="contact__lead">
                    Have a project, an internship, or just a question? Send me a message
                    and I'll reply within two days.
                </p>

                <ul class="contact__list">
                    <li>
                        <span class="contact__label">Email</span>
                        <a href="mailto:vipinpatelvp23@gmail.com">vipinpatelvp23@gmail.com</a>
                    </li>
                    <li>
                        <span class="contact__label">Location</span>
                        <span>Kanpur, Uttar Pradesh, India</span>
                    </li>
                </ul>

                <div class="contact__social">
                    <a href="https://github.com/vipinpatelcodes" target="_blank" rel="noopener">GitHub</a>
                    <a href="https://www.linkedin.com/in/vipin-patel-b701ab400/" target="_blank"
                        rel="noopener">LinkedIn</a>
                </div>
            </div>

            <form class="contact__form" id="contactForm">

                <div class="field">
                    <label for="cf-name">Your name</label>
                    <input id="cf-name" name="name" type="text" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="cf-email">Your email</label>
                    <input id="cf-email" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="cf-message">Message</label>
                    <textarea id="cf-message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="contact__btn">Send message</button>
                <p class="contact__status" id="contactStatus" role="status" aria-live="polite"></p>
            </form>

        </div>
    </section>

    <script src="not.js"></script>

</body>

</html>
